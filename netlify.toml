[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# הכלי הוא אפליקציית עמוד יחיד — כל נתיב מוגש מאותו קובץ,
# והניתוב מתבצע בצד הלקוח.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# עובד הרקע חייב להיטען תמיד טרי, אחרת התראות הדחיפה נתקעות על גרסה ישנה
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
